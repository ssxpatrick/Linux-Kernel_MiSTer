name: Build MiSTer Linux Kernel

on:
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: 'Branch/tag of MiSTer-devel/Linux-Kernel_MiSTer to build'
        required: false
        default: 'master'
  push:
    tags:
      - 'kernel-v*'

env:
  TOOLCHAIN_NAME: gcc-linaro-6.5.0-2018.12-x86_64_arm-linux-gnueabihf
  TOOLCHAIN_URL: https://releases.linaro.org/components/toolchain/binaries/6.5-2018.12/arm-linux-gnueabihf/gcc-linaro-6.5.0-2018.12-x86_64_arm-linux-gnueabihf.tar.xz

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libncurses-dev libncurses5-dev \
            flex bison openssl libssl-dev dkms libelf-dev libudev-dev libpci-dev \
            libiberty-dev autoconf liblz4-tool bc curl lzop u-boot-tools \
            libgmp3-dev libmpc-dev

      - name: Cache cross-compiler toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: /opt/${{ env.TOOLCHAIN_NAME }}
          key: ${{ env.TOOLCHAIN_NAME }}

      - name: Download ARM cross-compiler toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -e
          ARCHIVE="${TOOLCHAIN_NAME}.tar.xz"
          # releases.linaro.org has been redirecting old release paths elsewhere,
          # so try a couple of known mirrors and verify we actually got an xz
          # archive (not an HTML error/redirect page) before trusting it.
          MIRRORS=(
            "${TOOLCHAIN_URL}"
            "https://releases-ie.linaro.org/components/toolchain/binaries/6.5-2018.12/arm-linux-gnueabihf/${ARCHIVE}"
            "https://snapshots.linaro.org/components/toolchain/binaries/6.5-2018.12/arm-linux-gnueabihf/${ARCHIVE}"
          )
          downloaded=0
          for url in "${MIRRORS[@]}"; do
            echo "Trying ${url}"
            rm -f "${ARCHIVE}"
            if wget -q -O "${ARCHIVE}" "${url}" && file "${ARCHIVE}" | grep -q "XZ compressed data"; then
              downloaded=1
              break
            fi
            echo "  -> not a valid archive from this mirror, trying next"
          done
          if [ "${downloaded}" -ne 1 ]; then
            echo "::error::Could not download a valid ${TOOLCHAIN_NAME}.tar.xz from any mirror" >&2
            exit 1
          fi
          sudo mkdir -p /opt
          sudo tar xf "${ARCHIVE}" -C /opt
          sudo chown -R root:root "/opt/${TOOLCHAIN_NAME}"

      - name: Clone MiSTer kernel sources
        run: |
          git clone --depth=1 --branch "${{ github.event.inputs.kernel_ref || 'master' }}" \
            https://github.com/MiSTer-devel/Linux-Kernel_MiSTer.git kernel-src

      - name: Configure and build kernel
        working-directory: kernel-src
        env:
          ARCH: arm
          EXTRAVERSION: -MiSTer
          CROSS_COMPILE: /opt/${{ env.TOOLCHAIN_NAME }}/bin/arm-linux-gnueabihf-
        run: |
          make MiSTer_defconfig
          make -j"$(nproc)" zImage
          make socfpga_cyclone5_de10_nano.dtb

      - name: Concatenate zImage + device tree
        working-directory: kernel-src
        run: cat arch/arm/boot/zImage arch/arm/boot/dts/socfpga_cyclone5_de10_nano.dtb > zImage_dtb

      - name: Set build metadata
        id: meta
        run: |
          echo "date=$(date +'%Y%m%d-%H%M%S')" >> "$GITHUB_OUTPUT"
          echo "sha=$(git -C kernel-src rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zImage_dtb
          path: kernel-src/zImage_dtb

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: mister-kernel-${{ steps.meta.outputs.date }}-${{ steps.meta.outputs.sha }}
          name: MiSTer Kernel Build ${{ steps.meta.outputs.date }}
          body: |
            Automated MiSTer Linux kernel build.
            Source ref: ${{ github.event.inputs.kernel_ref || 'master' }}
            Source commit: ${{ steps.meta.outputs.sha }}
          files: kernel-src/zImage_dtb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
